/**:
  ros__parameters:
    use_sim_time: true

/stereo/disparity:
  ros__parameters:
    approximate_sync: false
    queue_size: 10
    correlation_window_size: 11
    min_disparity: 0
    disparity_range: 96
    uniqueness_ratio: 10.0
    speckle_size: 100
    speckle_range: 2

/stereo/point_cloud:
  ros__parameters:
    approximate_sync: false
    queue_size: 10
    use_color: false
